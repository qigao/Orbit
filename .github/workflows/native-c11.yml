name: Orbit native C11 Service contract

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "core/**"
      - "ace/**"
      - "tests/**"
      - ".github/workflows/native-c11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Only the newest exact HEAD of one PR executes. No superseded FIFO runners.
concurrency:
  group: orbit-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-c11:
    name: Real CFlow / ServiceHost SDK · Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact Orbit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout immutable SaltsCore 0.1 source owner
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-core
          ref: cfc1ed0d24364689b10ef7a85cff28d8776eb7db
          path: _deps/salts-core
          persist-credentials: false

      - name: Checkout immutable Salts 4.0 CMeta ACE CFlow source owner
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 408c07803c84687653a7e2d1625c79a69d535f87
          path: _deps/salts
          persist-credentials: false

      - name: Verify exact source HEAD identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _deps/salts-core rev-parse HEAD)" = cfc1ed0d24364689b10ef7a85cff28d8776eb7db
          test "$(git -C _deps/salts rev-parse HEAD)" = 408c07803c84687653a7e2d1625c79a69d535f87
          echo "ORBIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H %s'

      - name: Install checksum-verified ccache and restore compilation cache
        uses: qigao/stun/.github/actions/setup-ccache@4688683111b38dae5c2d814482b955dfc2e7d0a3
        with:
          profile: orbit-m0-real-native-sdk
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build/install exact SaltsCore 0.1 native shared owners
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-0.1"
          cmake -S _deps/salts-core -B _build/core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            "-DCMAKE_INSTALL_PREFIX=$core"
          cmake --build _build/core --parallel 2
          cmake --install _build/core

      - name: Build/install exact Salts 4.0 CMeta ACE CFlow owners
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/saltscore-0.1"
          salts="$RUNNER_TEMP/salts-4.0"
          cmake -S _deps/salts -B _build/salts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            "-DCMAKE_PREFIX_PATH=$core" \
            "-DCMAKE_INSTALL_PREFIX=$salts"
          cmake --build _build/salts --parallel 2
          cmake --install _build/salts

      - name: Restore exact successful salts-idlc host SDK from canonical SaltsUtils CI
        uses: actions/download-artifact@v4
        with:
          name: salts-utils-qualified-sdk-linux-x64
          repository: qigao/salts-utils
          run-id: 41168655686
          github-token: ${{ github.token }}
          path: _deps/saltsutils-idl-host

      - name: Verify canonical host tool provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('_deps/saltsutils-idl-host')
          obj = json.loads((p / 'sdk-provenance.json').read_text())
          assert obj['repository'] == 'qigao/salts-utils', obj
          assert obj['source_sha'] == '852b5cc741ef0debb1735b03e129bb30a136f038', obj
          assert obj['run_id'] == '41168655686', obj
          assert obj['rid'] == 'linux-x64', obj
          PY
          # download-artifact does not preserve executable mode bits.
          # Restore execute permission ONLY on the exact provenance-pinned CLI.
          test -f _deps/saltsutils-idl-host/utils/bin/salts-idlc
          chmod 755 _deps/saltsutils-idl-host/utils/bin/salts-idlc
          test -x _deps/saltsutils-idl-host/utils/bin/salts-idlc
          test -f _deps/saltsutils-idl-host/utils/include/data_bind_binding_plan.h
          test -f _deps/saltsutils-idl-host/salts/lib/libsalts.so.2.3
          # Salts 2.3 is only the isolated compiler HOST dependency.
          # The downstream compiled Orbit process links ONLY Salts 4.

      - name: Build and execute Orbit real native CTests — Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/salts-4.0;$RUNNER_TEMP/saltscore-0.1"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/saltscore-0.1/lib:${LD_LIBRARY_PATH:-}"
          for mode in Debug Release; do
            cmake -S . -B "_build/orbit-$mode" -G Ninja \
              "-DCMAKE_BUILD_TYPE=$mode" \
              "-DCMAKE_PREFIX_PATH=$sdk" \
              -DBUILD_TESTING=ON -DORBIT_BUILD_ACE=ON \
              -DORBIT_IDL_CONFORMANCE=ON \
              "-DORBIT_IDL_SDK_ROOT=$GITHUB_WORKSPACE/_deps/saltsutils-idl-host"
            cmake --build "_build/orbit-$mode" --parallel 2
            ctest --test-dir "_build/orbit-$mode" \
              --no-tests=error --output-on-failure --timeout 120
          done

      - name: Confirm opt-out standalone Core has no mandatory ACE target
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/salts-4.0;$RUNNER_TEMP/saltscore-0.1"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/saltscore-0.1/lib:${LD_LIBRARY_PATH:-}"
          cmake -S . -B _build/orbit-core-only -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$sdk" \
            -DBUILD_TESTING=ON -DORBIT_BUILD_ACE=OFF \
            -DORBIT_IDL_CONFORMANCE=ON \
            "-DORBIT_IDL_SDK_ROOT=$GITHUB_WORKSPACE/_deps/saltsutils-idl-host"
          cmake --build _build/orbit-core-only --parallel 2
          ctest --test-dir _build/orbit-core-only \
            --no-tests=error --output-on-failure --timeout 120

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Retain actual native CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-native-c11-${{ github.run_id }}
          path: |
            _build/orbit-Debug/Testing/Temporary/LastTest.log
            _build/orbit-Release/Testing/Temporary/LastTest.log
            _build/orbit-core-only/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  windows-x64:
    name: Real CFlow / ServiceHost SDK · Windows x64
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact Orbit source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout immutable SaltsCore 0.1
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-core
          ref: cfc1ed0d24364689b10ef7a85cff28d8776eb7db
          path: _deps/salts-core
          persist-credentials: false

      - name: Checkout immutable Salts 4.0
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 408c07803c84687653a7e2d1625c79a69d535f87
          path: _deps/salts
          persist-credentials: false

      - name: Verify all exact source commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _deps/salts-core rev-parse HEAD)" = cfc1ed0d24364689b10ef7a85cff28d8776eb7db
          test "$(git -C _deps/salts rev-parse HEAD)" = 408c07803c84687653a7e2d1625c79a69d535f87

      - name: Restore verified ccache tool and compiler outputs
        uses: qigao/stun/.github/actions/setup-ccache@4688683111b38dae5c2d814482b955dfc2e7d0a3
        with:
          profile: orbit-m0-windows-msvc-x64
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and install real Windows SaltsCore 0.1 shared owner
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _deps/salts-core -B _build/core -G 'Visual Studio 18 2026' -A x64 \
            -DBUILD_TESTING=OFF \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/saltscore-0.1"
          cmake --build _build/core --config Release --parallel 2
          cmake --install _build/core --config Release

      - name: Build and install real Windows Salts 4.0 CMeta ACE CFlow owner
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _deps/salts -B _build/salts -G 'Visual Studio 18 2026' -A x64 \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/saltscore-0.1" \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/salts-4.0"
          cmake --build _build/salts --config Release --parallel 2
          cmake --install _build/salts --config Release

      - name: Restore exact Windows salts-idlc host SDK
        uses: actions/download-artifact@v4
        with:
          name: salts-utils-qualified-sdk-windows-x64
          repository: qigao/salts-utils
          run-id: 41168655686
          github-token: ${{ github.token }}
          path: _deps/saltsutils-idl-host

      - name: Verify Windows native generator provenance and host DLL closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE '_deps/saltsutils-idl-host'
          $meta = Get-Content -LiteralPath (Join-Path $root 'sdk-provenance.json') -Raw | ConvertFrom-Json
          if ($meta.repository -ne 'qigao/salts-utils' -or
              $meta.source_sha -ne '852b5cc741ef0debb1735b03e129bb30a136f038' -or
              $meta.run_id -ne '41168655686' -or
              $meta.rid -ne 'windows-x64') {
            throw "Unexpected salts-idlc Windows SDK provenance: $($meta | ConvertTo-Json -Compress)"
          }
          foreach ($rel in @('utils/bin/salts-idlc.exe',
                             'utils/include/data_bind_binding_plan.h',
                             'salts/bin/salts.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $rel))) {
              throw "Pinned compiler host artifact incomplete: $rel"
            }
          }
          # Old Salts 2.3 DLL is loaded only inside external idlc.exe.
          # Orbit target links and runs with installed canonical Salts 4.

      - name: Build and run real Windows x64 C11 and C++17 CTests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$RUNNER_TEMP/saltscore-0.1")/bin:$(cygpath -u "$RUNNER_TEMP/salts-4.0")/bin:$PATH"
          sdk="$RUNNER_TEMP/salts-4.0;$RUNNER_TEMP/saltscore-0.1"
          cmake -S . -B _build/orbit-ace -G 'Visual Studio 18 2026' -A x64 \
            "-DCMAKE_PREFIX_PATH=$sdk" \
            -DBUILD_TESTING=ON -DORBIT_BUILD_ACE=ON \
            -DORBIT_IDL_CONFORMANCE=ON \
            "-DORBIT_IDL_SDK_ROOT=$GITHUB_WORKSPACE/_deps/saltsutils-idl-host"
          cmake --build _build/orbit-ace --config Release --parallel 2
          ctest --test-dir _build/orbit-ace -C Release \
            --no-tests=error --output-on-failure --timeout 120
          cmake -S . -B _build/orbit-core-only -G 'Visual Studio 18 2026' -A x64 \
            "-DCMAKE_PREFIX_PATH=$sdk" \
            -DBUILD_TESTING=ON -DORBIT_BUILD_ACE=OFF \
            -DORBIT_IDL_CONFORMANCE=ON \
            "-DORBIT_IDL_SDK_ROOT=$GITHUB_WORKSPACE/_deps/saltsutils-idl-host"
          cmake --build _build/orbit-core-only --config Release --parallel 2
          ctest --test-dir _build/orbit-core-only -C Release \
            --no-tests=error --output-on-failure --timeout 120

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Keep actual CTest logs on failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-native-windows-x64-${{ github.run_id }}
          path: |
            _build/orbit-ace/Testing/Temporary/LastTest.log
            _build/orbit-core-only/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
